name: Update Clash Subscription

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

permissions:
  contents: write

concurrency:
  group: clash-speedtest-update
  cancel-in-progress: false

jobs:
  speedtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download clash-speedtest
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(mktemp)
          curl -fsSL https://api.github.com/repos/faceair/clash-speedtest/releases/latest -o "$release_json"
          asset_url=$(jq -er '.assets[] | select(.name == "clash-speedtest_Linux_x86_64.tar.gz") | .browser_download_url' "$release_json")
          checksums_url=$(jq -er '.assets[] | select(.name == "checksums.txt") | .browser_download_url' "$release_json")
          curl -fsSL "$asset_url" -o clash-speedtest_Linux_x86_64.tar.gz
          curl -fsSL "$checksums_url" -o checksums.txt
          grep ' clash-speedtest_Linux_x86_64.tar.gz$' checksums.txt | sha256sum --check --strict -
          tar -xzf clash-speedtest_Linux_x86_64.tar.gz
          chmod 0755 clash-speedtest
          ./clash-speedtest -v

      - name: Test nodes and generate subscription
        id: speedtest
        env:
          CLASH_SOURCE_URL: ${{ secrets.CLASH_SOURCE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLASH_SOURCE_URL:-}"
          set +e
          ./clash-speedtest -c "$CLASH_SOURCE_URL" -concurrent 12 -download-size 3145728 -timeout 3s -max-latency 1500ms -max-packet-loss 70 -min-download-speed 0.2 -output single_node_test.new.yaml
          speedtest_exit=$?
          set -e
          if [ "$speedtest_exit" -ne 0 ] || [ ! -s single_node_test.new.yaml ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^proxies:[[:space:]]*\[\][[:space:]]*$' single_node_test.new.yaml || ! grep -Eq '^[[:space:]]*-[[:space:]]+name:' single_node_test.new.yaml; then
            echo "No usable proxies were exported. Preserving the previous subscription."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mv -f single_node_test.new.yaml single_node_test.yaml
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated subscription
        if: steps.speedtest.outputs.updated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add -- single_node_test.yaml
          if git diff --cached --quiet; then
            echo "Subscription has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update tested Clash subscription"
          git push origin HEAD:main
